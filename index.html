<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator + Rumus Matematika</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f9; color: #1f1f1f; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    
    header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #e9edf7; }
    header h1 { color: #0b57d0; font-size: 26px; margin-bottom: 6px; }
    header p { color: #5e5e5e; font-size: 14px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #444746; }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid #c4c7c5; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    select:focus, input:focus { border-color: #0b57d0; box-shadow: 0 0 0 2px rgba(11,87,208,0.2); }

    .fraction-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .fraction-box { display: flex; flex-direction: column; gap: 6px; flex: 1; background: #f8f9fc; padding: 12px; border-radius: 10px; }
    .fraction-inputs { display: flex; gap: 6px; align-items: center; }
    .fraction-inputs input { text-align: center; }
    .operator-label { font-size: 20px; font-weight: bold; color: #0b57d0; text-align: center; }

    .calc-btn { width: 100%; background: #0b57d0; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .calc-btn:hover { background: #0842a0; }

    .result-box { margin-top: 24px; padding: 16px; border-radius: 12px; background: #f0f4f9; border-left: 5px solid #0b57d0; display: none; }
    .result-box h3 { color: #0b57d0; font-size: 16px; margin-bottom: 8px; }
    .result-value { font-size: 24px; font-weight: 700; color: #1f1f1f; margin-bottom: 8px; }
    .result-steps { font-size: 14px; color: #444746; white-space: pre-line; line-height: 1.5; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #e0e2e0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Kalkulator + Rumus</h1>
    <p>Pilih rumus matematika dan masukkan angka yang diketahui</p>
  </header>

  <div class="form-group">
    <label for="formula-select">Pilih Rumus Matematika:</label>
    <select id="formula-select" onchange="renderInputs()">
      <optgroup label="Pecahan Campuran">
        <option value="tambah_campuran">Penjumlahan Pecahan Campuran</option>
        <option value="kurang_campuran">Pengurangan Pecahan Campuran</option>
        <option value="kali_campuran">Perkalian Pecahan Campuran</option>
        <option value="bagi_campuran">Pembagian Pecahan Campuran</option>
        <option value="campuran_ke_biasa">Ubah Pecahan Campuran ke Biasa/Desimal</option>
      </optgroup>
      <optgroup label="Pecahan Biasa & Konversi">
        <option value="tambah_pecahan">Penjumlahan Pecahan Biasa (a/b + c/d)</option>
        <option value="kurang_pecahan">Pengurangan Pecahan Biasa (a/b - c/d)</option>
        <option value="kali_pecahan">Perkalian Pecahan Biasa (a/b × c/d)</option>
        <option value="bagi_pecahan">Pembagian Pecahan Biasa (a/b ÷ c/d)</option>
        <option value="pecahan_ke_desimal">Konversi Pecahan ke Desimal</option>
        <option value="pecahan_ke_persen">Konversi Pecahan ke Persen (%)</option>
      </optgroup>
      <optgroup label="Bangun Datar">
        <option value="luas_persegi">Luas Persegi (s × s)</option>
        <option value="luas_persegi_panjang">Luas Persegi Panjang (p × l)</option>
        <option value="luas_segitiga">Luas Segitiga (½ × a × t)</option>
        <option value="luas_lingkaran">Luas Lingkaran (π × r²)</option>
      </optgroup>
      <optgroup label="Bangun Ruang">
        <option value="volume_kubus">Volume Kubus (s³)</option>
        <option value="volume_balok">Volume Balok (p × l × t)</option>
        <option value="volume_tabung">Volume Tabung (π × r² × t)</option>
      </optgroup>
      <optgroup label="Teorema & Lainnya">
        <option value="pythagoras_c">Pythagoras - Cari Miring c (√(a² + b²))</option>
        <option value="persen">Hitung Persentase (Nilai / Total × 100%)</option>
      </optgroup>
    </select>
  </div>

  <div id="inputs-container"></div>

  <button class="calc-btn" onclick="calculate()">Hitung Hasil</button>

  <div id="result-box" class="result-box">
    <h3>Hasil Perhitungan:</h3>
    <div id="result-value" class="result-value">0</div>
    <div id="result-steps" class="result-steps"></div>
  </div>
</div>

<script>
  function getFPB(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { let t = b; b = a % b; a = t; }
    return a;
  }

  function formatFraction(num, den) {
    if (den === 0) return { str: 'Tak terdefinisi', mixed: 'Tak terdefinisi' };
    const fpb = getFPB(num, den);
    let sNum = num / fpb;
    let sDen = den / fpb;
    if (sDen < 0) { sNum = -sNum; sDen = -sDen; }

    let simpleStr = sDen === 1 ? `${sNum}` : `${sNum}/${sDen}`;
    
    // Format Pecahan Campuran
    let mixedStr = simpleStr;
    if (Math.abs(sNum) >= sDen && sDen !== 1) {
      const whole = Math.floor(Math.abs(sNum) / sDen) * (sNum < 0 ? -1 : 1);
      const rem = Math.abs(sNum) % sDen;
      mixedStr = rem === 0 ? `${whole}` : `${whole} ${rem}/${sDen}`;
    }

    return { num: sNum, den: sDen, str: simpleStr, mixed: mixedStr };
  }

  function renderInputs() {
    const selected = document.getElementById('formula-select').value;
    const container = document.getElementById('inputs-container');
    const resultBox = document.getElementById('result-box');
    container.innerHTML = '';
    resultBox.style.display = 'none';

    // Pecahan Campuran (2 Bilangan)
    if (['tambah_campuran', 'kurang_campuran', 'kali_campuran', 'bagi_campuran'].includes(selected)) {
      const opSymbol = selected === 'tambah_campuran' ? '+' : selected === 'kurang_campuran' ? '-' : selected === 'kali_campuran' ? '×' : '÷';
      container.innerHTML = `
        <div class="fraction-row">
          <div class="fraction-box">
            <label>Pecahan Pertama:</label>
            <div class="fraction-inputs">
              <input type="number" id="w1" placeholder="Utuh (A)" style="flex:1">
              <div style="display:flex; flex-direction:column; flex:1; gap:4px;">
                <input type="number" id="num1" placeholder="Pembilang (a)">
                <input type="number" id="den1" placeholder="Penyebut (b)">
              </div>
            </div>
          </div>
          <div class="operator-label">${opSymbol}</div>
          <div class="fraction-box">
            <label>Pecahan Kedua:</label>
            <div class="fraction-inputs">
              <input type="number" id="w2" placeholder="Utuh (B)" style="flex:1">
              <div style="display:flex; flex-direction:column; flex:1; gap:4px;">
                <input type="number" id="num2" placeholder="Pembilang (c)">
                <input type="number" id="den2" placeholder="Penyebut (d)">
              </div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // Konversi Pecahan Campuran Tunggal
    if (selected === 'campuran_ke_biasa') {
      container.innerHTML = `
        <div class="fraction-box">
          <label>Masukkan Pecahan Campuran (A a/b):</label>
          <div class="fraction-inputs">
            <input type="number" id="w1" placeholder="Bilangan Utuh (A)">
            <div style="display:flex; flex-direction:column; flex:1; gap:4px;">
              <input type="number" id="num1" placeholder="Pembilang (a)">
              <input type="number" id="den1" placeholder="Penyebut (b)">
            </div>
          </div>
        </div>
      `;
      return;
    }

    // Pecahan Biasa
    if (['tambah_pecahan', 'kurang_pecahan', 'kali_pecahan', 'bagi_pecahan'].includes(selected)) {
      const opSymbol = selected === 'tambah_pecahan' ? '+' : selected === 'kurang_pecahan' ? '-' : selected === 'kali_pecahan' ? '×' : '÷';
      container.innerHTML = `
        <div class="fraction-row">
          <div class="fraction-box">
            <label>Pecahan Pertama (a/b):</label>
            <input type="number" id="num1" placeholder="Pembilang (a)">
            <input type="number" id="den1" placeholder="Penyebut (b)">
          </div>
          <div class="operator-label">${opSymbol}</div>
          <div class="fraction-box">
            <label>Pecahan Kedua (c/d):</label>
            <input type="number" id="num2" placeholder="Pembilang (c)">
            <input type="number" id="den2" placeholder="Penyebut (d)">
          </div>
        </div>
      `;
      return;
    }

    if (['pecahan_ke_desimal', 'pecahan_ke_persen'].includes(selected)) {
      container.innerHTML = `
        <div class="form-group"><label>Pembilang:</label><input type="number" id="num1" placeholder="Masukkan pembilang"></div>
        <div class="form-group"><label>Penyebut:</label><input type="number" id="den1" placeholder="Masukkan penyebut"></div>
      `;
      return;
    }

    // Default geometri & umum
    const formulaFields = {
      luas_persegi: [{ id: 's', label: 'Sisi (s)' }],
      luas_persegi_panjang: [{ id: 'p', label: 'Panjang (p)' }, { id: 'l', label: 'Lebar (l)' }],
      luas_segitiga: [{ id: 'a', label: 'Alas (a)' }, { id: 't', label: 'Tinggi (t)' }],
      luas_lingkaran: [{ id: 'r', label: 'Jari-jari (r)' }],
      volume_kubus: [{ id: 's', label: 'Sisi (s)' }],
      volume_balok: [{ id: 'p', label: 'Panjang (p)' }, { id: 'l', label: 'Lebar (l)' }, { id: 't', label: 'Tinggi (t)' }],
      volume_tabung: [{ id: 'r', label: 'Jari-jari (r)' }, { id: 't', label: 'Tinggi (t)' }],
      pythagoras_c: [{ id: 'a', label: 'Sisi Tegak a' }, { id: 'b', label: 'Sisi Datar b' }],
      persen: [{ id: 'val', label: 'Nilai Sebagian' }, { id: 'total', label: 'Nilai Total' }]
    };

    (formulaFields[selected] || []).forEach(field => {
      const group = document.createElement('div');
      group.className = 'form-group';
      group.innerHTML = `<label for="${field.id}">${field.label}:</label><input type="number" id="${field.id}" step="any" placeholder="Masukkan ${field.label}">`;
      container.appendChild(group);
    });
  }

  function calculate() {
    const selected = document.getElementById('formula-select').value;
    let res = '', steps = '';
    const getVal = (id) => parseFloat(document.getElementById(id)?.value || 0);

    // Operasi Pecahan Campuran
    if (['tambah_campuran', 'kurang_campuran', 'kali_campuran', 'bagi_campuran'].includes(selected)) {
      const w1 = getVal('w1'), a = getVal('num1'), b = getVal('den1');
      const w2 = getVal('w2'), c = getVal('num2'), d = getVal('den2');

      if (b === 0 || d === 0) { alert('Penyebut tidak boleh 0!'); return; }

      // Ubah ke pecahan biasa
      const impNum1 = (Math.abs(w1) * b + a) * (w1 < 0 ? -1 : 1);
      const impNum2 = (Math.abs(w2) * d + c) * (w2 < 0 ? -1 : 1);

      let resNum, resDen, opName;
      if (selected === 'tambah_campuran') {
        resNum = (impNum1 * d) + (impNum2 * b); resDen = b * d; opName = '+';
      } else if (selected === 'kurang_campuran') {
        resNum = (impNum1 * d) - (impNum2 * b); resDen = b * d; opName = '-';
      } else if (selected === 'kali_campuran') {
        resNum = impNum1 * impNum2; resDen = b * d; opName = '×';
      } else if (selected === 'bagi_campuran') {
        if (impNum2 === 0) { alert('Pembagi tidak boleh 0!'); return; }
        resNum = impNum1 * d; resDen = b * impNum2; opName = '÷';
      }

      const formatted = formatFraction(resNum, resDen);
      res = formatted.mixed;
      steps = `1. Ubah ke pecahan biasa:\n   Pecahan 1 = ${impNum1}/${b}\n   Pecahan 2 = ${impNum2}/${d}\n\n2. Hitung (${impNum1}/${b} ${opName} ${impNum2}/${d}):\n   Hasil Biasa = ${resNum}/${resDen}\n\n3. Sederhanakan & Campuran:\n   Pecahan Biasa = ${formatted.str}\n   Pecahan Campuran = ${formatted.mixed}\n   Desimal = ${(resNum/resDen).toFixed(4)}`;
    }
    else if (selected === 'campuran_ke_biasa') {
      const w = getVal('w1'), a = getVal('num1'), b = getVal('den1');
      if (b === 0) { alert('Penyebut tidak boleh 0!'); return; }
      const impNum = (Math.abs(w) * b + a) * (w < 0 ? -1 : 1);
      const formatted = formatFraction(impNum, b);
      res = `${impNum}/${b}`;
      steps = `Rumus: (Utuh × Penyebut + Pembilang) / Penyebut\nPerhitungan: (${w} × ${b} + ${a}) / ${b} = ${impNum}/${b}\n\nDisederhanakan = ${formatted.str}\nNilai Desimal = ${(impNum/b).toFixed(4)}`;
    }
    // Pecahan Biasa
    else if (['tambah_pecahan', 'kurang_pecahan', 'kali_pecahan', 'bagi_pecahan'].includes(selected)) {
      const a = getVal('num1'), b = getVal('den1'), c = getVal('num2'), d = getVal('den2');
      if (b === 0 || d === 0) { alert('Penyebut tidak boleh 0!'); return; }
      let resNum = 0, resDen = 1;
      if (selected === 'tambah_pecahan') { resNum = (a * d) + (c * b); resDen = b * d; }
      else if (selected === 'kurang_pecahan') { resNum = (a * d) - (c * b); resDen = b * d; }
      else if (selected === 'kali_pecahan') { resNum = a * c; resDen = b * d; }
      else if (selected === 'bagi_pecahan') { resNum = a * d; resDen = b * c; }

      const formatted = formatFraction(resNum, resDen);
      res = formatted.str;
      steps = `Hasil Pecahan Biasa = ${resNum}/${resDen}\nDisederhanakan = ${formatted.str}\nPecahan Campuran = ${formatted.mixed}\nDesimal = ${(resNum/resDen).toFixed(4)}`;
    }
    else if (selected === 'pecahan_ke_desimal') {
      const a = getVal('num1'), b = getVal('den1');
      res = (a / b).toFixed(4).replace(/\.?0+$/, '');
      steps = `Perhitungan: ${a} ÷ ${b} = ${res}`;
    }
    else if (selected === 'pecahan_ke_persen') {
      const a = getVal('num1'), b = getVal('den1');
      res = `${((a / b) * 100).toFixed(2).replace(/\.?0+$/, '')}%`;
      steps = `Perhitungan: (${a} ÷ ${b}) × 100% = ${res}`;
    }
    else {
      let numRes = 0;
      if (selected === 'luas_persegi') numRes = getVal('s') ** 2;
      else if (selected === 'luas_persegi_panjang') numRes = getVal('p') * getVal('l');
      else if (selected === 'luas_segitiga') numRes = 0.5 * getVal('a') * getVal('t');
      else if (selected === 'luas_lingkaran') numRes = Math.PI * (getVal('r') ** 2);
      else if (selected === 'volume_kubus') numRes = getVal('s') ** 3;
      else if (selected === 'volume_balok') numRes = getVal('p') * getVal('l') * getVal('t');
      else if (selected === 'volume_tabung') numRes = Math.PI * (getVal('r') ** 2) * getVal('t');
      else if (selected === 'pythagoras_c') numRes = Math.sqrt(getVal('a')**2 + getVal('b')**2);
      else if (selected === 'persen') numRes = (getVal('val') / (getVal('total') || 1)) * 100;
      
      res = Number.isInteger(numRes) ? numRes : numRes.toFixed(2);
      steps = `Hasil: ${res}`;
    }

    const resultBox = document.getElementById('result-box');
    document.getElementById('result-value').textContent = res;
    document.getElementById('result-steps').textContent = steps;
    resultBox.style.display = 'block';
  }

  renderInputs();
</script>

</body>
</html>
