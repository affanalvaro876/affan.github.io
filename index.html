<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEPAT MATEMATIKA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #007bff, #00d2ff);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #555;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: #007bff;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row .form-group {
            flex: 1;
        }

        button.btn-hitung {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button.btn-hitung:hover {
            background-color: #218838;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            min-height: 60px;
        }

        .result-title {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1b2a47;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CEPAT MATEMATIKA</h1>
    </header>

    <div class="content">
        <!-- Pilihan Operasi Matematika -->
        <div class="form-group">
            <label for="kategori">Pilih Jenis Perhitungan:</label>
            <select id="kategori" onchange="renderInputFields()">
                <option value="penjumlahan">Penjumlahan (+)</option>
                <option value="pengurangan">Pengurangan (-)</option>
                <option value="perkalian">Perkalian (×)</option>
                <option value="pembagian">Pembagian (÷)</option>
                <option value="pitagoras">Pitagoras (Sisi Miring)</option>
                <option value="luas">Luas Bangun Datar</option>
                <option value="volume">Volume Bangun Ruang</option>
                <option value="kpk">KPK (Kelipatan Persekutuan Terkecil)</option>
                <option value="fpb">FPB (Faktor Persekutuan Terbesar)</option>
                <option value="pecahan">Pecahan Biasa (Penjumlahan)</option>
                <option value="pecahan_campuran">Konversi Pecahan Campuran ke Biasa</option>
                <option value="desimal">Konversi Pecahan ke Desimal</option>
                <option value="persen">Persentase (% dari Jumlah)</option>
                <option value="lainnya">Lainnya (Pangkat & Akar)</option>
            </select>
        </div>

        <!-- Impitan Angka (Input Fields) -->
        <div id="dynamic-inputs">
            <!-- Diisi secara dinamis oleh JavaScript -->
        </div>

        <button class="btn-hitung" onclick="hitung()">HITUNG</button>

        <!-- Area Hasil -->
        <div class="result-box">
            <div class="result-title">Hasil Perhitungan:</div>
            <div class="result-value" id="hasil">-</div>
        </div>
    </div>
</div>

<script>
    function renderInputFields() {
        const kategori = document.getElementById('kategori').value;
        const container = document.getElementById('dynamic-inputs');
        container.innerHTML = '';

        if (['penjumlahan', 'pengurangan', 'perkalian', 'pembagian', 'kpk', 'fpb'].includes(kategori)) {
            container.innerHTML = `
                <div class="input-row">
                    <div class="form-group">
                        <label>Angka Pertama:</label>
                        <input type="number" id="num1" placeholder="0" step="any">
                    </div>
                    <div class="form-group">
                        <label>Angka Kedua:</label>
                        <input type="number" id="num2" placeholder="0" step="any">
                    </div>
                </div>
            `;
        } else if (kategori === 'pitagoras') {
            container.innerHTML = `
                <div class="input-row">
                    <div class="form-group">
                        <label>Sisi Alas (a):</label>
                        <input type="number" id="num1" placeholder="0" step="any">
                    </div>
                    <div class="form-group">
                        <label>Sisi Tegak (b):</label>
                        <input type="number" id="num2" placeholder="0" step="any">
                    </div>
                </div>
            `;
        } else if (kategori === 'luas') {
            container.innerHTML = `
                <div class="form-group">
                    <label>Bentuk Bangun Datar:</label>
                    <select id="sub_luas" onchange="renderSubLuas()">
                        <option value="persegi">Persegi</option>
                        <option value="persegi_panjang">Persegi Panjang</option>
                        <option value="segitiga">Segitiga</option>
                        <option value="lingkaran">Lingkaran</option>
                    </select>
                </div>
                <div id="sub-luas-inputs"></div>
            `;
            renderSubLuas();
        } else if (kategori === 'volume') {
            container.innerHTML = `
                <div class="form-group">
                    <label>Bentuk Bangun Ruang:</label>
                    <select id="sub_volume" onchange="renderSubVolume()">
                        <option value="kubus">Kubus</option>
                        <option value="balok">Balok</option>
                        <option value="tabung">Tabung</option>
                    </select>
                </div>
                <div id="sub-volume-inputs"></div>
            `;
            renderSubVolume();
        } else if (kategori === 'pecahan') {
            container.innerHTML = `
                <label>Pecahan 1 (Pembilang / Penyebut):</label>
                <div class="input-row">
                    <div class="form-group"><input type="number" id="num1" placeholder="Pembilang 1"></div>
                    <div class="form-group"><input type="number" id="den1" placeholder="Penyebut 1"></div>
                </div>
                <label>Pecahan 2 (Pembilang / Penyebut):</label>
                <div class="input-row">
                    <div class="form-group"><input type="number" id="num2" placeholder="Pembilang 2"></div>
                    <div class="form-group"><input type="number" id="den2" placeholder="Penyebut 2"></div>
                </div>
            `;
        } else if (kategori === 'pecahan_campuran') {
            container.innerHTML = `
                <label>Pecahan Campuran (Bulat + Pembilang / Penyebut):</label>
                <div class="input-row">
                    <div class="form-group"><input type="number" id="num_bulat" placeholder="Bil. Bulat"></div>
                    <div class="form-group"><input type="number" id="num1" placeholder="Pembilang"></div>
                    <div class="form-group"><input type="number" id="den1" placeholder="Penyebut"></div>
                </div>
            `;
        } else if (kategori === 'desimal') {
            container.innerHTML = `
                <label>Pecahan Biasa:</label>
                <div class="input-row">
                    <div class="form-group"><input type="number" id="num1" placeholder="Pembilang"></div>
                    <div class="form-group"><input type="number" id="den1" placeholder="Penyebut"></div>
                </div>
            `;
        } else if (kategori === 'persen') {
            container.innerHTML = `
                <div class="input-row">
                    <div class="form-group">
                        <label>Persen (%):</label>
                        <input type="number" id="num1" placeholder="Contoh: 20" step="any">
                    </div>
                    <div class="form-group">
                        <label>Dari Total:</label>
                        <input type="number" id="num2" placeholder="Contoh: 150000" step="any">
                    </div>
                </div>
            `;
        } else if (kategori === 'lainnya') {
            container.innerHTML = `
                <div class="form-group">
                    <label>Jenis Operasi:</label>
                    <select id="sub_lainnya" onchange="renderSubLainnya()">
                        <option value="pangkat">Pangkat (x^y)</option>
                        <option value="akar">Akar Kuadrat (√x)</option>
                        <option value="modulo">Sisa Bagi (Modulo)</option>
                    </select>
                </div>
                <div id="sub-lainnya-inputs"></div>
            `;
            renderSubLainnya();
        }
    }

    function renderSubLuas() {
        const sub = document.getElementById('sub_luas').value;
        const box = document.getElementById('sub-luas-inputs');
        if (sub === 'persegi') {
            box.innerHTML = `<div class="form-group"><label>Sisi:</label><input type="number" id="num1" step="any"></div>`;
        } else if (sub === 'persegi_panjang') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Panjang:</label><input type="number" id="num1" step="any"></div>
                    <div class="form-group"><label>Lebar:</label><input type="number" id="num2" step="any"></div>
                </div>`;
        } else if (sub === 'segitiga') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Alas:</label><input type="number" id="num1" step="any"></div>
                    <div class="form-group"><label>Tinggi:</label><input type="number" id="num2" step="any"></div>
                </div>`;
        } else if (sub === 'lingkaran') {
            box.innerHTML = `<div class="form-group"><label>Jari-jari (r):</label><input type="number" id="num1" step="any"></div>`;
        }
    }

    function renderSubVolume() {
        const sub = document.getElementById('sub_volume').value;
        const box = document.getElementById('sub-volume-inputs');
        if (sub === 'kubus') {
            box.innerHTML = `<div class="form-group"><label>Sisi/Rusuk:</label><input type="number" id="num1" step="any"></div>`;
        } else if (sub === 'balok') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Panjang:</label><input type="number" id="num1" step="any"></div>
                    <div class="form-group"><label>Lebar:</label><input type="number" id="num2" step="any"></div>
                </div>
                <div class="form-group"><label>Tinggi:</label><input type="number" id="num3" step="any"></div>`;
        } else if (sub === 'tabung') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Jari-jari (r):</label><input type="number" id="num1" step="any"></div>
                    <div class="form-group"><label>Tinggi (t):</label><input type="number" id="num2" step="any"></div>
                </div>`;
        }
    }

    function renderSubLainnya() {
        const sub = document.getElementById('sub_lainnya').value;
        const box = document.getElementById('sub-lainnya-inputs');
        if (sub === 'pangkat') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Angka Utama (x):</label><input type="number" id="num1" step="any"></div>
                    <div class="form-group"><label>Pangkat (y):</label><input type="number" id="num2" step="any"></div>
                </div>`;
        } else if (sub === 'akar') {
            box.innerHTML = `<div class="form-group"><label>Angka (x):</label><input type="number" id="num1" step="any"></div>`;
        } else if (sub === 'modulo') {
            box.innerHTML = `
                <div class="input-row">
                    <div class="form-group"><label>Angka Utama:</label><input type="number" id="num1"></div>
                    <div class="form-group"><label>Pembagi:</label><input type="number" id="num2"></div>
                </div>`;
        }
    }

    // Helper Fungsi Matematis
    function getGCD(a, b) {
        return b === 0 ? Math.abs(a) : getGCD(b, a % b);
    }

    function getLCM(a, b) {
        if (a === 0 || b === 0) return 0;
        return Math.abs((a * b) / getGCD(a, b));
    }

    function hitung() {
        const kategori = document.getElementById('kategori').value;
        const displayHasil = document.getElementById('hasil');
        let res = 0;

        const val = id => parseFloat(document.getElementById(id)?.value) || 0;

        switch (kategori) {
            case 'penjumlahan':
                res = val('num1') + val('num2');
                break;
            case 'pengurangan':
                res = val('num1') - val('num2');
                break;
            case 'perkalian':
                res = val('num1') * val('num2');
                break;
            case 'pembagian':
                const div = val('num2');
                res = div !== 0 ? (val('num1') / div) : 'Tidak bisa dibagi 0';
                break;
            case 'pitagoras':
                res = Math.sqrt(Math.pow(val('num1'), 2) + Math.pow(val('num2'), 2));
                break;
            case 'luas':
                const subL = document.getElementById('sub_luas').value;
                if (subL === 'persegi') res = Math.pow(val('num1'), 2);
                else if (subL === 'persegi_panjang') res = val('num1') * val('num2');
                else if (subL === 'segitiga') res = 0.5 * val('num1') * val('num2');
                else if (subL === 'lingkaran') res = Math.PI * Math.pow(val('num1'), 2);
                break;
            case 'volume':
                const subV = document.getElementById('sub_volume').value;
                if (subV === 'kubus') res = Math.pow(val('num1'), 3);
                else if (subV === 'balok') res = val('num1') * val('num2') * val('num3');
                else if (subV === 'tabung') res = Math.PI * Math.pow(val('num1'), 2) * val('num2');
                break;
            case 'kpk':
                res = getLCM(val('num1'), val('num2'));
                break;
            case 'fpb':
                res = getGCD(val('num1'), val('num2'));
                break;
            case 'pecahan':
                const d1 = val('den1'), d2 = val('den2');
                if (d1 === 0 || d2 === 0) {
                    res = 'Penyebut tidak boleh 0';
                } else {
                    const top = (val('num1') * d2) + (val('num2') * d1);
                    const bottom = d1 * d2;
                    const gcd = getGCD(top, bottom);
                    res = `${top / gcd} / ${bottom / gcd} (${(top / bottom).toFixed(4)})`;
                }
                break;
            case 'pecahan_campuran':
                const dC = val('den1');
                if (dC === 0) {
                    res = 'Penyebut tidak boleh 0';
                } else {
                    const topC = (val('num_bulat') * dC) + val('num1');
                    res = `${topC} / ${dC}`;
                }
                break;
            case 'desimal':
                const dD = val('den1');
                res = dD !== 0 ? (val('num1') / dD) : 'Penyebut tidak boleh 0';
                break;
            case 'persen':
                res = (val('num1') / 100) * val('num2');
                break;
            case 'lainnya':
                const subO = document.getElementById('sub_lainnya').value;
                if (subO === 'pangkat') res = Math.pow(val('num1'), val('num2'));
                else if (subO === 'akar') res = Math.sqrt(val('num1'));
                else if (subO === 'modulo') res = val('num1') % val('num2');
                break;
        }

        if (typeof res === 'number') {
            res = Number.isInteger(res) ? res : res.toFixed(4).replace(/\.?0+$/, '');
        }

        displayHasil.innerText = res;
    }

    // Inisialisasi awal saat halaman dibuka
    renderInputFields();
</script>

</body>
</html>
